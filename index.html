<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luckee Skills</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luckee Skills">
<meta name="theme-color" content="#0a0a0a">
<style>
:root{
  --accent:#1f7a4d; --accent-dark:#175c3a; --accent-light:#e6f3ec;
  --bg:#f6f7f5; --card:#ffffff; --text:#16201b; --muted:#6b7972; --border:#e2e6e3;
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
h1{font-size:22px; margin:0 0 4px; font-weight:700;}
.sub{color:var(--muted); font-size:14px; margin-bottom:16px;}
.tabs{display:flex; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:16px;}
.tab{flex:1; text-align:center; padding:10px 8px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; border:none; background:none;}
.tab.active{background:var(--accent-light); color:var(--accent-dark);}
.pillrow{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.pill{flex:none; padding:9px 16px; border-radius:20px; border:1px solid var(--border); background:var(--card); font-size:14px; cursor:pointer; white-space:nowrap;}
.pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer;}
.card .name{font-weight:600; font-size:15px;}
.card .meta{color:var(--muted); font-size:12px; margin-top:2px;}
.detail{margin-top:10px; border-top:1px solid var(--border); padding-top:10px; display:none;}
.detail.open{display:block;}
.ing-row{display:flex; justify-content:space-between; padding:5px 0; font-size:14px; border-bottom:1px solid #f0f0ee;}
.ing-row:last-child{border-bottom:none;}
.method{font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5;}
.badge{display:inline-block; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-size:12px; color:var(--muted); margin-right:6px;}
.primary-btn{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; width:100%;}
.ghost-btn{background:none; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; width:100%;}
.qcard{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center;}
.qcard .dish{font-size:13px; color:var(--muted); margin-bottom:6px;}
.qcard .question{font-size:17px; font-weight:600; margin-bottom:20px;}
.opt{display:block; width:100%; padding:14px; margin-bottom:10px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:15px; cursor:pointer; text-align:center;}
.opt.correct{background:#e8f5e9; border-color:#4caf50; color:#2e7d32; font-weight:700;}
.opt.wrong{background:#fdecea; border-color:#e57373; color:#c62828;}
.opt[disabled]{cursor:default;}
.progress{font-size:13px; color:var(--muted); margin-bottom:10px; text-align:center;}
.result{text-align:center; padding:30px 16px;}
.result .score{font-size:48px; font-weight:800; color:var(--accent);}
.result .label{color:var(--muted); font-size:14px; margin-top:4px;}
.setup-field{margin-bottom:16px;}
.setup-field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px; font-weight:600;}

input[type=text],input[type=number],select,textarea{font-family:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); width:100%;}
textarea{resize:vertical;}
.linkbtn{background:none; border:none; color:var(--accent); font-size:15px; font-weight:600; cursor:pointer; padding:8px 0; font-family:inherit;}
.empty{color:var(--muted); font-size:14px; padding:8px 0;}
.card.row{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:default;}
.card.row .ghost-btn{width:auto; padding:9px 14px;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.modal{background:var(--card); border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px; max-height:88vh; overflow:auto; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
.modal h3{margin:0 0 14px;}
.modal .close{display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;}
.big-add{margin-bottom:14px;}

.pick-btn{flex:1 1 100%; text-align:left; font-family:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px;}
.pick-btn.placeholder{color:var(--muted);}
.pick-sub{display:block; font-size:12px; color:var(--muted); margin-top:2px;}
.picker-bg{position:fixed; inset:0; background:var(--bg); z-index:80;}
.picker{max-width:640px; height:100%; margin:0 auto; display:flex; flex-direction:column; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
.picker-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.picker-title{font-size:18px; font-weight:700;}
.picker-list{flex:1; overflow-y:auto; margin-top:4px; -webkit-overflow-scrolling:touch;}
.pk-item{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; font-size:15px; color:var(--text);}
.pk-item .pk-name{font-weight:600;}
.pk-item .pk-tags{margin-top:5px;}
.pk-hint{color:var(--muted); font-size:13px; text-align:center; padding:8px 0;}

#installBanner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;background:#0a0a0a;color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);display:none;font-size:15px;line-height:1.4}
#installBanner .ib-row{display:flex;align-items:center;gap:12px}
#installBanner img{width:48px;height:48px;border-radius:12px;flex:none}
#installBanner b{color:#e47149}
#installBanner .ib-btn{background:#e47149;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:10px;width:100%}
#installBanner .ib-x{background:none;border:0;color:#aaa;font-size:22px;margin-left:auto;align-self:flex-start;padding:0 4px}
#installBanner .ib-steps{margin-top:8px;color:#ddd}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.tile{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 12px; text-align:left; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--text); min-height:74px;}
.tile .ti{font-size:22px; display:block; margin-bottom:6px;}
.tile.soon{opacity:.55;}
.tile.dark{background:#0a0a0a; color:#fff; border-color:#0a0a0a;}
.tile.wide{grid-column:1 / -1; min-height:auto; display:flex; align-items:center; gap:10px;}
.tile.wide .ti{display:inline; margin:0;}
.quickrow{display:flex; gap:8px; overflow-x:auto; margin:10px 0 14px; padding-bottom:2px;}
.quickrow button{flex:none; border:1px solid var(--border); background:var(--card); border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--text);}
#secScreen{position:fixed; inset:0; background:var(--bg); z-index:500; overflow-y:auto; display:none; -webkit-overflow-scrolling:touch;}
#secScreen .sec-head{position:sticky; top:0; background:var(--bg); padding:12px 16px 10px; padding-top:calc(12px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; z-index:2;}
#secScreen .sec-back{border:1px solid var(--border); background:var(--card); border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;}
#secScreen .sec-title{font-size:17px; font-weight:700;}
.doc{font-size:15px; line-height:1.55;}
.doc h3{font-size:16px; margin:22px 0 8px;}
.doc p{margin:0 0 10px;}
.doc ul,.doc ol{margin:0 0 12px; padding-left:22px;}
.doc li{margin-bottom:4px;}
.doc .note{background:var(--accent-light); color:var(--accent-dark); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-weight:600; font-size:14px;}
.doc .stage{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
.doc .stage-h{display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; font-weight:700;}
.doc .stage-h .chev{margin-left:auto; color:var(--muted);}
.doc .stage-b{padding:0 14px 12px; display:none;}
.doc .stage.open .stage-b{display:block;}
.doc .stage.done .stage-h{color:var(--accent-dark);}
.doc .stage-done-btn{width:100%; margin-top:6px; border-radius:10px; padding:11px; border:1px solid var(--accent); background:#fff; color:var(--accent); font-weight:600; font-size:14px; font-family:inherit;}
.doc .stage.done .stage-done-btn{background:var(--accent); color:#fff;}
.doc .tbl{overflow-x:auto; margin:0 0 14px;}
.doc table{border-collapse:collapse; font-size:13px; min-width:520px; width:100%; background:var(--card);}
.doc th,.doc td{border:1px solid var(--border); padding:7px 8px; text-align:left; vertical-align:top;}
.doc th{background:#f0f2f0;}
.ck-item{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer; font-size:14px; line-height:1.45;}
.ck-box{flex:none; width:24px; height:24px; border-radius:7px; border:2px solid #b9c3bd; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; margin-top:1px;}
.ck-item.on{border-color:var(--accent); background:var(--accent-light);}
.ck-item.on .ck-box{background:var(--accent); border-color:var(--accent);}
.ck-progress{height:8px; background:#e3e8e5; border-radius:6px; overflow:hidden; margin:4px 0 14px;}
.ck-progress div{height:100%; background:var(--accent); width:0;}
.secfield{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:15px; font-family:inherit; margin-bottom:12px;}
</style>
</head>
<body>
<div id="entryScreen" style="max-width:420px; margin:40px auto; padding:20px;">
  <h1 style="text-align:center;">Гид для поваров</h1>
  <div class="sub" style="text-align:center;">Прежде чем начать, представьтесь</div>
  <div class="tiles">
    <button class="tile" data-sec="planCook"><span class="ti">🗓</span>План стажировки</button>
    <button class="tile" data-sec="sanitary"><span class="ti">🧼</span>Санитария</button>
  </div>
  <div class="setup-field">
    <label>Имя</label>
    <input type="text" id="entryName" placeholder="Например, Асан">
  </div>
  <div class="setup-field">
    <label>Ресторан</label>
    <select id="entryRest" style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); font-size:15px;">
      <option>Luckee Yu Достык</option>
      <option>Luckee Yu Достык Плаза</option>
      <option>Luckee Yu Мега Алматы</option>
      <option>Luckee Yu Мега Астана</option>
    </select>
  </div>
  <div class="setup-field">
    <label>Станция</label>
    <div class="pillrow" id="entryStationPills"></div>
  </div>
  <div class="setup-field">
    <label>Что хотите сделать</label>
    <div class="pillrow" id="entryModePills"></div>
  </div>
  <button class="primary-btn" id="entryStartBtn">Начать</button>
  <div class="msg" id="entryMsg" style="color:#c0453a; font-size:13px; margin-top:8px; min-height:16px;"></div>
  <button class="tile dark wide" data-sec="chef" style="margin-top:18px; width:100%;"><span class="ti">👨‍🍳</span>Для шефа и су-шефа</button>
  <button class="linkbtn" id="showAdminLoginBtn" style="display:block; margin:12px auto 0;">🔐 Я администратор</button>
  <div style="text-align:center; color:#9aa79f; font-size:11px; margin-top:8px;">версия 11</div>
</div>

<div id="adminLoginScreen" style="display:none; max-width:420px; margin:40px auto; padding:20px;">
  <h1 style="text-align:center;">Вход администратора</h1>
  <div class="setup-field">
    <label>Код администратора</label>
    <input type="text" id="adminCodeInput" placeholder="Код">
  </div>
  <button class="primary-btn" id="adminCodeBtn">Войти</button>
  <div class="msg" id="adminCodeMsg" style="color:#c0453a; font-size:13px; margin-top:8px; min-height:16px;"></div>
  <button class="linkbtn" id="backToEntryBtn" style="display:block; margin:16px auto 0;">← Назад</button>
</div>

<div id="mainApp" style="display:none;">
<div class="wrap">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>Гид для поваров</h1>
      <div class="sub" id="userInfoLine" style="margin-bottom:0;"></div>
    </div>
    <button class="tab" id="changeUserBtn" style="width:auto; padding:8px 12px;">Сменить</button>
  </div>
  <div class="quickrow">
    <button data-sec="planCook">🗓 План стажировки</button>
    <button data-sec="sanitary">🧼 Санитария</button>
    <button data-sec="chef">👨‍🍳 Шеф / су-шеф</button>
  </div>
  <div class="sub">Граммовки и приготовление — изучение и тест</div>

  <div class="tabs">
    <button class="tab active" id="tabStudy">📖 Изучение</button>
    <button class="tab" id="tabQuiz">📝 Тест</button>
    <button class="tab" id="tabResults">📊 Результаты</button>
  </div>

  <div id="studyScreen">
    <div class="pillrow" id="stationPillsStudy"></div>
    <div class="pillrow" id="typePillsStudy"></div>
    <div id="dishList"></div>
  </div>

  <div id="quizScreen" style="display:none;">
    <div id="quizSetup">
      <div class="setup-field">
        <label>Станция</label>
        <div class="pillrow" id="stationPillsQuiz"></div>
      </div>
      <div class="setup-field">
        <label>Тип</label>
        <div class="pillrow" id="typePillsQuiz"></div>
      </div>
      <div class="setup-field">
        <label>Сложность</label>
        <div class="pillrow" id="difficultyPills"></div>
      </div>
      <div class="setup-field">
        <label>Количество вопросов</label>
        <div class="pillrow" id="countPills"></div>
      </div>
      <button class="primary-btn" id="startQuizBtn">Начать тест</button>
    </div>
    <div id="quizPlay" style="display:none;"></div>
    <div id="quizResult" style="display:none;"></div>
  </div>

  <div id="resultsScreen" style="display:none;">
    <div class="pillrow" id="resultsStationPills"></div>
    <div id="resultsList"></div>
  </div>
</div>
</div>

<div id="adminScreen" style="display:none;">
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <h1>Тех.карты (админ) <span style="font-size:11px; color:#9aa79f; font-weight:400;">v11</span></h1>
      <button class="tab" id="adminLogoutBtn" style="width:auto; padding:8px 12px;">Выйти</button>
    </div>

    <div id="adminDishesScreen">
      <button class="primary-btn big-add" id="shareAppBtn" style="background:#0a0a0a;margin-bottom:10px;">📤 Поделиться ссылкой с поварами</button>
      <div id="shareMsg" style="display:none;font-size:13px;color:#1f7a4d;margin:-4px 0 10px;text-align:center;"></div>
      <button class="primary-btn big-add" id="addDishBtn">+ Создать ТТК (тех.карту)</button>
      <div class="pillrow" id="adminDishStationPills"></div>
      <div id="adminDishList"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="pickerRoot"></div>

const API_URL = 'https://script.google.com/macros/s/AKfycbxj4TAtOy6x_6TBDqT_brJi27ochNtCfD4BjdJV-yYNTflKVGw_ga4jHkcNrzThqUlf/exec';
function fetchT(url, opts, ms){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||25000);
  return fetch(url, Object.assign({}, opts||{}, {signal:c.signal})).finally(()=>clearTimeout(t));
}
let LAST_API_ERROR = '';
async function apiGet(action){
  let r;
  try{ r = await fetchT(API_URL + '?action=' + encodeURIComponent(action) + '&t=' + Date.now()); }
  catch(e){ LAST_API_ERROR = 'нет связи с сервером (' + action + ')'; throw e; }
  if(!r.ok){ LAST_API_ERROR = 'сервер ответил ' + r.status + ' (' + action + ')'; }
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
async function apiPost(payload){
  const r = await fetchT(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
  const j = await r.json();
  if(!j.ok){ const e = new Error(j.error || 'Ошибка сервера'); e.auth = (j.auth===false); throw e; }
  return j;
}

function buildQuestionPool(){
  const pool = [];
  const list = DISHES.filter(d => (quizStation==='Все станции' || d.station===quizStation) && matchesType(d, quizType));
  list.forEach(d=>{
    // "Базовый" = только первый (главный) ингредиент каждого блюда/заготовки,
    // "Продвинутый" = все ингредиенты, включая соусы и специи
    const ings = quizDifficulty==='Базовый' ? d.ingredients.slice(0,1) : d.ingredients;
    ings.forEach(ing=>{
      pool.push({dish:d.name, station:d.station, ingredient:ing.name, unit:ing.unit, netto:ing.netto});
    });
  });
  return pool;
}

function pickDistractors(correct, unit, allPool, n){
  const candidates = allPool.filter(x=>x.unit===unit && x.netto!==correct);
  const uniqueVals = [...new Set(candidates.map(x=>x.netto))];
  // prefer values close in magnitude to the correct one (0.3x–3x range) so options
  // stay plausible and don't create "noise" from wildly different scales
  const close = uniqueVals.filter(v => v >= correct*0.3 && v <= correct*3);
  const far = uniqueVals.filter(v => v < correct*0.3 || v > correct*3);
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  shuffle(close); shuffle(far);
  const picked = close.slice(0, n);
  if(picked.length < n) picked.push(...far.slice(0, n-picked.length));
  return picked;
}

  if(pool.length < 4){ alert('Недостаточно данных для теста в этой станции.'); return; }
  const shuffled = pool.slice();
  for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; }
  quizQuestions = shuffled.slice(0, Math.min(quizCount, shuffled.length));
  quizIndex = 0; quizScore = 0; quizWrongList = [];
  quizInProgress = true;
  document.getElementById('tabStudy').style.opacity='0.5';
  document.getElementById('quizSetup').style.display='none';
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizPlay').style.display='block';
  renderQuestion();
};

function renderQuestion(){
  const q = quizQuestions[quizIndex];
  const pool = buildQuestionPool();
  const distractors = pickDistractors(q.netto, q.unit, pool, 3);
  let options = [q.netto, ...distractors];
  if(options.length < 4){
    // pad with synthetic distractors if not enough real data
    while(options.length<4){ options.push(q.netto * (1 + (options.length*0.3+0.2))); }
  }
  for(let i=options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [options[i],options[j]]=[options[j],options[i]]; }

  const el = document.getElementById('quizPlay');
  el.innerHTML = `<div class="progress">Вопрос ${quizIndex+1} из ${quizQuestions.length} · счёт: ${quizScore} · <span id="timerLabel">${QUESTION_SECONDS}</span> сек</div>
    <div class="qcard">
      <div class="dish">${esc(q.dish)} (${esc(q.station)})</div>
      <div class="question">Сколько нужно «${esc(q.ingredient)}»?</div>
      <div id="optsWrap"></div>
    </div>`;
  const wrap = document.getElementById('optsWrap');

  function stopTimer(){ if(quizTimer){ clearInterval(quizTimer); quizTimer=null; } }

  function answer(val, timedOut){
    stopTimer();
    wrap.querySelectorAll('.opt').forEach(o=>o.disabled=true);
    const isCorrect = !timedOut && Math.abs(val - q.netto) < 1e-9;
    if(isCorrect){ quizScore++; }
    else {
      quizWrongList.push({q, given: timedOut ? null : val});
    }
    [...wrap.children].forEach(o=>{
      if(o.dataset.v && Math.abs(parseFloat(o.dataset.v)-q.netto)<1e-9) o.classList.add('correct');
      else if(o.dataset.v && !timedOut && Math.abs(parseFloat(o.dataset.v)-val)<1e-9 && !isCorrect) o.classList.add('wrong');
    });
    setTimeout(()=>{
      quizIndex++;
      if(quizIndex < quizQuestions.length) renderQuestion();
      else renderResult();
    }, isCorrect ? 600 : 1400);
  }

  options.forEach(val=>{
    const btn = document.createElement('button');
    btn.className='opt';
    btn.textContent = fmtQty(q.unit, val);
    btn.dataset.v = val;
    btn.onclick = ()=> answer(val, false);
    wrap.appendChild(btn);
  });

  quizTimeLeft = QUESTION_SECONDS;
  quizTimer = setInterval(()=>{
    quizTimeLeft--;
    const lbl = document.getElementById('timerLabel');
    if(lbl) lbl.textContent = quizTimeLeft;
    if(quizTimeLeft <= 0){
      answer(null, true);
    }
  }, 1000);
}

function renderResult(){
  quizInProgress = false;
  document.getElementById('tabStudy').style.opacity='1';
  document.getElementById('quizPlay').style.display='none';
  const el = document.getElementById('quizResult');
  el.style.display='block';
  const pct = Math.round(100*quizScore/quizQuestions.length);
  const passed = (quizScore/quizQuestions.length) >= PASS_THRESHOLD;
  let wrongHtml = '';
  if(quizWrongList.length){
    wrongHtml = '<div style="text-align:left; margin-top:20px;"><div style="font-weight:700; margin-bottom:8px;">Разбор ошибок:</div>' +
      quizWrongList.map(w=>`<div class="ing-row"><span>${esc(w.q.dish)} — ${esc(w.q.ingredient)}${w.given===null?' (время вышло)':''}</span><span>верно: <b>${fmtQty(w.q.unit,w.q.netto)}</b></span></div>`).join('') +
      '</div>';
  }
  el.innerHTML = `<div class="result">
      <div class="score">${quizScore}/${quizQuestions.length}</div>
      <div class="label">${pct}% правильных ответов</div>
      <div class="label" style="margin-top:8px; font-weight:700; color:${passed?'#2e7d32':'#c62828'};">${passed?'✅ Сдал':'❌ Нужно пересдать (нужно 80%+)'}</div>
    </div>
    ${wrongHtml}
    <button class="ghost-btn" id="retryBtn" style="margin-top:20px;">Пройти ещё раз</button>`;
  document.getElementById('retryBtn').onclick = ()=>{
    document.getElementById('quizResult').style.display='none';
    document.getElementById('quizSetup').style.display='block';
  };
  saveQuizResult({score:quizScore, total:quizQuestions.length, pct, passed});
}

let EXTRA_PRODUCTS = [];
async function loadExtraProducts(){
  try{
    const j = await apiGet('products');
    EXTRA_PRODUCTS = j.products || [];
  }catch(e){ console.error('load extra products failed', e); }
}
function getAllProducts(){
  const out = PRODUCT_SEED.map(p=>({name:p.n, unit:p.u, article:p.a||'', kind:p.t}));
  const seen = new Set(out.map(p=>p.name.toLowerCase()+'|'+p.unit));
  EXTRA_PRODUCTS.forEach(p=>{
    if(!p.name) return;
    const k = p.name.toLowerCase()+'|'+p.unit;
    if(seen.has(k)) return;
    seen.add(k);
    out.push({name:p.name, unit:p.unit, article:p.article||'', kind:p.kind||'p', custom:true});
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

function openProductPicker(onPick){
  const root = document.getElementById('pickerRoot');
  const all = getAllProducts();
  let query = '', kind = 'all';
  const KINDS = [['all','Все'],['p','Продукты'],['pf','Полуфабрикаты']];
  const LIMIT = 80;

  root.innerHTML = `<div class="picker-bg"><div class="picker">
    <div class="picker-head"><div class="picker-title">Выбор продукта</div><button type="button" class="linkbtn" id="pkClose">Закрыть</button></div>
    <input type="text" id="pkSearch" placeholder="Поиск: название или артикул" autocomplete="off">
    <div class="pillrow" id="pkKinds" style="margin:10px 0 4px;"></div>
    <div class="picker-list" id="pkList"></div>
    <button type="button" class="primary-btn" id="pkNew" style="margin-top:10px;">+ Добавить новый продукт</button>
  </div></div>`;

  function renderKinds(){
    const el = root.querySelector('#pkKinds');
    el.innerHTML = KINDS.map(([k,l])=>`<button type="button" class="pill ${k===kind?'active':''}" data-k="${k}">${l}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k; renderKinds(); renderList(); });
  }
  function renderList(){
    const q = query.trim().toLowerCase();
    let list = all.filter(p=>(kind==='all' || p.kind===kind) && (!q || p.name.toLowerCase().includes(q) || (p.article||'').includes(q)));
    const total = list.length;
    const shown = list.slice(0, LIMIT);
    const el = root.querySelector('#pkList');
    if(total===0){
      el.innerHTML = '<div class="pk-hint">Ничего не найдено. Нажмите «+ Добавить новый продукт» внизу.</div>';
      return;
    }
    el.innerHTML = shown.map((p,i)=>`<button type="button" class="pk-item" data-i="${i}">
        <div class="pk-name">${esc(p.name)}</div>
        <div class="pk-tags"><span class="badge">${esc(p.unit)}</span>${p.article?`<span class="badge">№${esc(p.article)}</span>`:''}${p.kind==='pf'?'<span class="badge">полуфабрикат</span>':''}${p.custom?'<span class="badge">добавлен вручную</span>':''}</div>
      </button>`).join('') + (total>LIMIT?`<div class="pk-hint">Показано ${LIMIT} из ${total} — уточните поиск</div>`:'');
    el.querySelectorAll('.pk-item').forEach(b=>b.onclick=()=>{
      const prod = shown[parseInt(b.dataset.i)];
      root.innerHTML='';
      onPick(prod);
    });
  }
  const searchEl = root.querySelector('#pkSearch');
  searchEl.addEventListener('input', e=>{ query = e.target.value; renderList(); });
  root.querySelector('#pkClose').onclick = ()=>{ root.innerHTML=''; };
  root.querySelector('#pkNew').onclick = ()=> openNewProductForm(query, onPick);
  renderKinds(); renderList();
}

        <div class="pillrow" id="dTypePills">
          <button type="button" class="pill ${d.type==='блюдо'?'active':''}" data-type="блюдо">Готовое блюдо</button>
          <button type="button" class="pill ${d.type==='заготовка'?'active':''}" data-type="заготовка">Заготовка</button>
        </div>
      </div>
      <div class="setup-field"><label>Ингредиенты и граммовка</label><div id="ingList">${ingredientsHtml()}</div>
        <button class="linkbtn" id="addIngBtn">+ Добавить ингредиент</button>
      </div>
      <div class="setup-field"><label>Способ приготовления</label><textarea id="dMethod" rows="4">${esc(d.method||'')}</textarea></div>
      <div class="setup-field"><label>Выход (кг, необязательно)</label><input type="text" id="dYield" value="${esc(d.yield||'')}"></div>
      <button class="primary-btn" id="dSaveBtn">Сохранить</button>
      ${!isNew ? '<button class="ghost-btn" id="dDeleteBtn" style="margin-top:10px; color:#c0453a;">Удалить тех.карту</button>' : ''}
      <button class="close" id="dCloseBtn">Отмена</button>
    </div></div>`;

    root.querySelector('#dCloseBtn').onclick = ()=>root.innerHTML='';
    root.querySelector('#mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') root.innerHTML=''; });

    // добавить ингредиент = сразу открыть список продуктов
    root.querySelector('#addIngBtn').onclick = ()=>{
      syncFromForm();
      openProductPicker((prod)=>{
        const ing = {name:prod.name, unit:prod.unit, netto:0};
        if(prod.article) ing.article = prod.article;
        d.ingredients.push(ing);
        render();
      });
    };
    // выбрать/заменить продукт в существующей строке
    root.querySelectorAll('[data-ing-pick]').forEach(btn=>{
      btn.onclick = ()=>{
        syncFromForm();
        const i = parseInt(btn.dataset.ingPick);
        openProductPicker((prod)=>{
          d.ingredients[i].name = prod.name;
          d.ingredients[i].unit = prod.unit;
          if(prod.article) d.ingredients[i].article = prod.article; else delete d.ingredients[i].article;
          render();
        });
      };
    });

    root.querySelectorAll('[data-station]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.station = btn.dataset.station; render(); };
    });
    root.querySelectorAll('[data-type]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.type = btn.dataset.type; render(); };
    });
    root.querySelectorAll('[data-ing-del]').forEach(btn=>{
      btn.onclick = ()=>{ syncFromForm(); d.ingredients.splice(parseInt(btn.dataset.ingDel),1); render(); };
    });

    if(!isNew){
      root.querySelector('#dDeleteBtn').onclick = async ()=>{
        if(!confirm('Точно удалить тех.карту «'+d.name+'»?')) return;
        try{ await apiPost({action:'deleteDish', code:getAdminCode(), id:d.id}); }
        catch(e){ handleAdminErr(e); return; }
        root.innerHTML='';
        loadAdminDishes();
      };
    }

    root.querySelector('#dSaveBtn').onclick = async ()=>{
      syncFromForm();
      d.name = d.name.trim();
      d.method = (d.method||'').trim();
      d.ingredients = d.ingredients.filter(ing=>ing.name);
      if(!d.name || d.ingredients.length===0){ alert('Укажите название и выберите хотя бы один продукт.'); return; }
      const body = {name:d.name, section:d.section||'', station:d.station, type:d.type, method:d.method, yield:d.yield, time:d.time, ingredients:d.ingredients};
      if(!isNew) body.id = d.id;
      const saveBtn = root.querySelector('#dSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Сохраняю…';
      try{ await apiPost({action:'saveDish', code:getAdminCode(), dish:body}); }
      catch(e){ saveBtn.disabled = false; saveBtn.textContent = 'Сохранить'; handleAdminErr(e); return; }
      root.innerHTML='';
      loadAdminDishes();
    };
  }
  render();
}
</script>

"}, {"t": "ul", "x": ["состав", "граммовку", "технологию", "время приготовления", "порядок закладки", "температуру", "выход", "посуду", "соус", "стандарт подачи", "аллергены"]}]}, {"t": "stage", "id": "st5", "title": "Этап 5. Практика во время сервиса", "blocks": [{"t": "p", "x": "После освоения блюд стажёр начинает работать на станции во время реального сервиса."}, {"t": "p", "x": "<b>Первый этап</b> — работает вместе с наставником."}, {"t": "p", "x": "<b>Второй этап</b> — выполняет основную работу самостоятельно, наставник контролирует."}, {"t": "p", "x": "<b>Третий этап</b> — работает самостоятельно, су-шеф контролирует результат."}, {"t": "p", "x": "Во время сервиса оценивается:"}, {"t": "ul", "x": ["скорость", "качество", "соблюдение рецептуры", "организация рабочего места", "коммуникация", "работа с чеками", "соблюдение очерёдности отдачи", "способность работать при высокой загрузке"]}]}, {"t": "stage", "id": "st6", "title": "Этап 6. Самостоятельная работа", "blocks": [{"t": "p", "x": "Стажёр получает станцию под контроль су-шефа. Он самостоятельно отвечает за:"}, {"t": "ul", "x": ["открытие станции", "mise en place", "заготовки", "качество продуктов", "приготовление блюд", "выдачу", "чистоту", "закрытие станции"]}, {"t": "p", "x": "Су-шеф не вмешивается без необходимости, а оценивает способность сотрудника самостоятельно организовать работу."}]}, {"t": "h", "x": "4. Допуск к аттестации"}, {"t": "p", "x": "Повар допускается к аттестации, если:"}, {"t": "ul", "x": ["освоил все обязательные блюда своей станции", "знает технологические карты", "умеет самостоятельно выполнять заготовки", "соблюдает санитарные требования", "способен самостоятельно работать на станции", "стабильно выдаёт блюда необходимого качества", "соблюдает установленные стандарты скорости"]}, {"t": "p", "x": "Если требования не выполнены — назначается дополнительный период обучения."}, {"t": "h", "x": "5. Принцип обучения"}, {"t": "note", "x": "ПОКАЗАЛ → ОБЪЯСНИЛ → ВЫПОЛНИЛ ВМЕСТЕ → ВЫПОЛНИЛ САМОСТОЯТЕЛЬНО → ПРОВЕРИЛ → ЗАКРЕПИЛ → АТТЕСТОВАЛ"}, {"t": "p", "x": "Стажировка считается завершённой не тогда, когда повар «знает блюда», а когда он стабильно способен самостоятельно выполнять работу на станции в реальном сервисе."}]}, "regChef": {"title": "Регламент работы шеф-повара", "icon": "📋", "blocks": [{"t": "h", "x": "1. Общие положения"}, {"t": "p", "x": "1.1. Шеф-повар является руководителем производственного подразделения ресторана и отвечает за бесперебойную работу кухни, качество и безопасность блюд, организацию работы поваров, а также за соблюдение стандартов компании."}, {"t": "p", "x": "1.2. В своей деятельности шеф-повар подчиняется бренд-шефу и шеф-координатору, партнёру и территориальному директору."}, {"t": "p", "x": "1.3. В случае отсутствия шеф-повара его обязанности исполняет су-шеф."}, {"t": "p", "x": "1.4. Шеф-повар обязан знать и соблюдать нормы законодательства Республики Казахстан в сфере общественного питания, санитарные требования, правила охраны труда и пожарной безопасности."}, {"t": "h", "x": "2. График и дисциплина труда"}, {"t": "p", "x": "2.1. Шеф-повар работает по графику 5/2, выходные — понедельник, вторник."}, {"t": "p", "x": "2.2. Рабочее время — с 09:30 до 20:00 (в смену минимум 10 ч)."}, {"t": "p", "x": "2.3. В случае необходимости (проверки, инвентаризация, обучение персонала и др.) шеф-повар обязан присутствовать вне рабочего графика без дополнительного согласования."}, {"t": "p", "x": "2.4. При необходимости отсутствия (по болезни, личным причинам и т. д.) шеф-повар обязан уведомить своего непосредственного руководителя — шеф-координатора или бренд-шефа — и поставить в известность директора ресторана."}, {"t": "p", "x": "2.5. Шеф-повар не имеет права покидать рабочее место раньше времени, приходить позже установленного начала смены или не выйти без уведомления."}, {"t": "p", "x": "2.6. Нарушение графика работы и дисциплины влечёт ответственность в соответствии с трудовым законодательством РК."}, {"t": "h", "x": "3. Организация производственного процесса"}, {"t": "p", "x": "3.1. Шеф-повар ежедневно контролирует выход сотрудников кухни."}, {"t": "p", "x": "3.2. С вечера шеф-повар обязан знать количество сотрудников, выходящих на следующий день, и в случае нехватки — заранее принять меры (поиск подмены, уведомление руководства)."}, {"t": "p", "x": "3.3. Ежедневно шеф-повар составляет чек-лист заготовок на следующий день."}, {"t": "p", "x": "3.4. В конце дня он обязан проверить наличие всех заготовок, если работал до завершения смены; в случае отсутствия — оперативно организовать выполнение."}, {"t": "p", "x": "3.5. В отсутствие шеф-повара его обязанности по проверке заготовок исполняет су-шеф."}, {"t": "p", "x": "3.6. Шеф-повар контролирует закуп продуктов, своевременно подаёт заявки товароведу, планирует закуп с учётом праздничных и выходных дней, а также уведомлений поставщиков."}, {"t": "p", "x": "3.7. Шеф-повар обеспечивает непрерывную работу кухни без стоп-листа — своевременно заказывает продукты, контролирует остатки и качество поставок."}, {"t": "p", "x": "3.8. Он обязан вести всю кухонную документацию и следить за своевременным заполнением журналов (температурный режим, уборка, хранение, брак и т. д.) в соответствии с требованиями НАССР."}, {"t": "p", "x": "3.9. Следит за сдачей документов для оформления новых сотрудников кухни и содействует их корректному предоставлению."}, {"t": "p", "x": "3.10. Заполняет и ведёт файлы адаптации стажёров и новых сотрудников кухни."}, {"t": "p", "x": "3.11. Шеф-повар отправляет график работы поваров в команду кухни не позднее установленного срока и ежемесячно (в двадцатых числах) направляет директору ресторана табель за текущий месяц."}, {"t": "p", "x": "3.12. Табель должен быть оформлен корректно: указаны оклады, стажировочные дни, замены и выходные."}, {"t": "p", "x": "3.13. При запросе директора запрещается задерживать предоставление табеля."}, {"t": "p", "x": "3.14. Шеф-повар не распоряжается кассой ресторана и не совершает финансовые операции, не относящиеся к его должностным обязанностям."}, {"t": "h", "x": "4. Качество блюд и стандарты приготовления"}, {"t": "p", "x": "4.1. Шеф-повар обязан знать технологические карты (ТТК) и контролировать их исполнение."}, {"t": "p", "x": "4.2. При этом он должен обладать гибкостью и профессиональным пониманием вкуса: если продукт (например, перец) имеет повышенную остроту, допускается корректировка количества ингредиента без нарушения общего вкусового баланса."}, {"t": "p", "x": "4.3. Шеф-повар несёт личную ответственность за вкус и внешний вид каждого блюда."}, {"t": "p", "x": "4.4. При поступлении жалоб или отзывов по кухне — обязан оперативно провести внутреннюю отработку:"}, {"t": "ul", "x": ["с поварами — по технологии приготовления", "с су-шефом — по контролю блюд", "с товароведом — при выявлении проблем в поставках"]}, {"t": "p", "x": "4.5. В случае повторяющихся замечаний — инициировать пересмотр ТТК у бренд-шефа или шеф-координатора."}, {"t": "p", "x": "4.6. При выявлении проблем с продуктом (например, поставлен бракованный полуфабрикат с другого филиала) шеф-повар обязан немедленно сообщить об этом и не использовать данный продукт в работе."}, {"t": "p", "x": "4.7. Он обязан заранее предотвращать возможные проблемы, прогнозировать нехватку продуктов, качество поставок."}, {"t": "h", "x": "5. Обучение и развитие персонала"}, {"t": "p", "x": "5.1. Шеф-повар отвечает за обучение и адаптацию новых сотрудников кухни."}, {"t": "p", "x": "5.2. В программу обучения обязательно входит:"}, {"t": "ul", "x": ["правила съёма и сдачи инвентаризации", "принципы ведения журналов НАССР", "стандарты подачи блюд", "культура кухни и ответственность"]}, {"t": "p", "x": "5.3. Обязан регулярно проводить внутренние мини-тренинги для поваров по качеству, скорости и санитарным нормам."}, {"t": "h", "x": "6. Взаимодействие и ответственность"}, {"t": "p", "x": "6.1. Шеф-повар несёт ответственность за:"}, {"t": "ul", "x": ["санитарное состояние кухни", "своевременность выхода сотрудников", "наличие заготовок", "отсутствие стоп-листа", "корректное ведение документации", "своевременную передачу табелей и отчётов", "качество и вкус блюд", "соблюдение дисциплины на кухне"]}, {"t": "p", "x": "6.2. В случае конфликтных или спорных ситуаций с гостями, отзывами или доставкой — шеф-повар вместе с директором и менеджером обязан оперативно реагировать и решать вопрос максимально быстро, сохраняя лояльность гостя."}, {"t": "p", "x": "6.3. После решения ситуации — разбор проводится отдельно с руководством, без задержки решения для гостя."}, {"t": "p", "x": "6.4. При увольнении сотрудников кухни шеф-повар обязан заранее уведомить директора и отправить запрос в рекрутинг на открытие вакансии."}, {"t": "h", "x": "7. Заключительные положения"}, {"t": "p", "x": "7.1. Настоящий регламент обязателен к исполнению шеф-поваром ресторана."}, {"t": "p", "x": "7.2. Любые изменения в регламент вносятся территориальным директором ресторана совместно с бренд-шефом или шеф-координатором."}, {"t": "p", "x": "7.3. Несоблюдение данных пунктов расценивается как нарушение трудовой дисциплины и может повлечь дисциплинарную ответственность согласно Трудовому кодексу Республики Казахстан."}]}, "regSous": {"title": "Регламент работы су-шефа", "icon": "📋", "blocks": [{"t": "h", "x": "1. Общие положения"}, {"t": "p", "x": "1.1. Су-шеф является заместителем шеф-повара и подчиняется непосредственно шеф-повару и директору ресторана."}, {"t": "p", "x": "1.2. На время отсутствия шеф-повара су-шеф исполняет его обязанности."}, {"t": "p", "x": "1.3. Цель работы — обеспечение бесперебойной, качественной и безопасной работы кухни ресторана в соответствии со стандартами бренда и санитарными нормами."}, {"t": "p", "x": "1.4. За 30 минут до открытия ресторана обязан проверить готовность кухни."}, {"t": "p", "x": "1.5. После закрытия — контролирует уборку, отключение оборудования и сдачу смены."}, {"t": "h", "x": "2. График и дисциплина труда"}, {"t": "p", "x": "2.1. Су-шеф работает по графику 2/2."}, {"t": "p", "x": "2.2. Рабочее время — с 09:30 до закрытия смены."}, {"t": "p", "x": "2.3. При необходимости отсутствия (по болезни, личным причинам и т. д.) су-шеф обязан уведомить своего непосредственного руководителя — шеф-повара — и поставить в известность директора ресторана."}, {"t": "p", "x": "2.4. Су-шеф не имеет права покидать рабочее место раньше времени, приходить позже установленного начала смены или не выйти без уведомления."}, {"t": "h", "x": "3. Контроль качества"}, {"t": "p", "x": "3.1. Проверка внешнего вида, вкуса и температуры блюд перед отдачей."}, {"t": "p", "x": "3.2. Проведение дегустаций и корректировок блюд по стандартам сети."}, {"t": "p", "x": "3.3. Контроль соблюдения санитарных правил, условий хранения и сроков годности продуктов."}, {"t": "h", "x": "4. Склад и учёт"}, {"t": "p", "x": "4.1. Контроль поступления и расхода продуктов."}, {"t": "p", "x": "4.2. Участие в инвентаризациях, списаниях и корректировках."}, {"t": "p", "x": "4.3. Ведение учётных журналов (журнал бактерицидной лампы, журнал учёта температурного режима холодильника, фритюрный журнал и т. п.)."}, {"t": "h", "x": "5. Организация работы кухни"}, {"t": "p", "x": "5.1. Контроль за выполнением технологических карт, норм закладки и стандартов подачи блюд."}, {"t": "p", "x": "5.2. Проверка готовности кухни к открытию/закрытию (чистота, оборудование, наличие инвентаря)."}, {"t": "p", "x": "5.3. Координация работы поваров на всех станциях (вок, роллы, горячий, холодный, заготовочный и т. д.)."}, {"t": "p", "x": "5.4. Контроль таймингов отдачи блюд (тикитайм):"}, {"t": "table", "head": ["Подразделение", "Тип блюда", "Норматив отдачи", "Примечание"], "rows": [["WOK станция", "Лапша, рис, блюда на воке", "15–20 мин", ""], ["Роллы / суши-станция", "Классические, запечённые, открытые роллы", "12–18 мин", "Запечённые — до 20 мин"], ["Горячий цех", "Супы, дамплинги", "12–18 мин", ""], ["Горячий цех", "Закуски, бао", "10–12 мин", "Горячие закуски (например, хрустящие баклажаны) — до 15 мин"], ["Десерты", "Готовые, отданные из-под ножа (моти)", "5–10 мин", ""], ["Delivery / упаковка на вынос", "Все категории", "+2 мин к базовому тикитайму", "Время на упаковку и комплектацию"]]}, {"t": "h", "x": "6. Работа с персоналом"}, {"t": "p", "x": "6.1. Обучение новых поваров и стажёров."}, {"t": "p", "x": "6.2. Ежедневный инструктаж по меню, техникам и безопасности."}, {"t": "p", "x": "6.3. Контроль дисциплины, внешнего вида и эффективности сотрудников кухни."}, {"t": "p", "x": "6.4. Мотивация команды и формирование позитивной атмосферы на смене."}, {"t": "h", "x": "7. Ответственность су-шефа"}, {"t": "p", "x": "7.1. За несоблюдение стандартов приготовления и санитарных норм."}, {"t": "p", "x": "7.2. За порчу и перерасход продуктов."}, {"t": "p", "x": "7.3. За нарушение правил техники безопасности и охраны труда."}, {"t": "p", "x": "7.4. За неправильное оформление журналов и учётной документации."}, {"t": "h", "x": "8. Взаимодействие"}, {"t": "p", "x": "8.1. С шеф-поваром — по вопросам меню, новых блюд, корректировки технологических карт."}, {"t": "p", "x": "8.2. С директором — по вопросам производительности, дисциплины и инвентаризации."}, {"t": "p", "x": "8.3. С администраторами и официантами — по вопросам отдачи и качества блюд."}, {"t": "h", "x": "9. Заключительные положения"}, {"t": "p", "x": "9.1. Настоящий регламент обязателен к исполнению су-шефом ресторана."}, {"t": "p", "x": "9.2. Любые изменения в регламент вносятся территориальным директором ресторана совместно с бренд-шефом или шеф-координатором."}, {"t": "p", "x": "9.3. Несоблюдение данных пунктов расценивается как нарушение трудовой дисциплины и может повлечь дисциплинарную ответственность согласно Трудовому кодексу Республики Казахстан."}]}, "sanLearn": {"title": "Санитария: учебный материал", "icon": "🧼", "blocks": [{"t": "p", "x": "Санитарные нормы и правила на объектах общественного питания."}, {"t": "h", "x": "Зачем соблюдать чистоту"}, {"t": "ul", "x": ["Довольный гость, хороша (function(){
  const RESTS = ['Luckee Yu Достык','Luckee Yu Достык Плаза','Luckee Yu Мега Алматы','Luckee Yu Мега Астана'];
  const scr = document.getElementById('secScreen'), body = document.getElementById('secBody'), title = document.getElementById('secTitle');
  let backTo = null;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ls = { get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

  function open(t, html, back){ title.textContent = t; body.innerHTML = html; backTo = back || null; scr.style.display='block'; scr.scrollTop = 0; document.body.style.overflow='hidden'; }
  function close(){ if(backTo){ const f = backTo; backTo = null; f(); return; } scr.style.display='none'; document.body.style.overflow=''; }
  document.getElementById('secBack').onclick = close;

  function blocksHtml(blocks){
    return blocks.map(b=>{
      if(b.t==='h') return '<h3>'+b.x+'</h3>';
      if(b.t==='p') return '<p>'+b.x+'</p>';
      if(b.t==='note') return '<div class="note">'+b.x+'</div>';
      if(b.t==='ul') return '<ul>'+b.x.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
      if(b.t==='ol') return '<ol>'+b.x.map(i=>'<li>'+i+'</li>').join('')+'</ol>';
      if(b.t==='table') return '<div class="tbl"><table><tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
      if(b.t==='stage') return '<div class="stage" data-id="'+b.id+'"><div class="stage-h"><span class="mark">○</span><span>'+b.title+'</span><span class="chev">▾</span></div><div class="stage-b">'+blocksHtml(b.blocks)+'<button class="stage-done-btn">Отметить этап пройденным</button></div></div>';
      return '';
    }).join('');
  }
  function showDoc(key, back){
    const d = SK.docs[key];
    open(d.title, '<div class="doc">'+blocksHtml(d.blocks)+'</div>', back);
    const done = ls.get('stagesDone', {});
    body.querySelectorAll('.stage').forEach(st=>{
      const id = st.dataset.id;
      const paint = ()=>{ const on = !!done[id]; st.classList.toggle('done', on); st.querySelector('.mark').textContent = on ? '✅' : '○'; st.querySelector('.stage-done-btn').textContent = on ? '✓ Этап пройден' : 'Отметить этап пройденным'; };
      st.querySelector('.stage-h').onclick = ()=> st.classList.toggle('open');
      st.querySelector('.stage-done-btn').onclick = ()=>{ done[id] = !done[id]; ls.set('stagesDone', done); paint(); };
      paint();
    });
  }
  function showSoon(t){ open(t, '<div class="doc"><div class="note">Раздел скоро появится.</div><p>Материалы готовятся и будут добавлены в приложение.</p></div>'); }

  // ---------- шеф / су-шеф ----------
  function chefCode(){ return ls.get('chefSession', null) ? ls.get('chefSession').code : ''; }
  function showChef(){
    if(!chefCode()) return showChefLogin();
    open('Шеф и су-шеф', `
      <div class="tiles">
        <button class="tile" data-go="ck"><span class="ti">✅</span>Чек-лист открытия и закрытия</button>
        <button class="tile" data-go="regChef"><span class="ti">📋</span>Регламент шеф-повара</button>
        <button class="tile" data-go="regSous"><span class="ti">📋</span>Регламент су-шефа</button>
        <button class="tile" data-go="sanReg"><span class="ti">🧼</span>Регламент по СанПиН</button>
        <button class="tile soon" data-go="planSous"><span class="ti">🗓</span>План стажировки су-шефа<br><span style="font-weight:400;font-size:12px;color:var(--muted)">скоро</span></button>
      </div>
      <button class="linkbtn" id="chefOut" style="display:block;margin:6px auto 0;color:var(--muted)">Выйти из раздела шефа</button>`);
    body.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{
      const g = b.dataset.go;
      if(g==='ck') showChecklistSetup();
      else if(g==='planSous') open('План стажировки су-шефа', '<div class="doc"><div class="note">Раздел скоро появится.</div></div>', showChef);
      else showDoc(g, showChef);
    });
    document.getElementById('chefOut').onclick = ()=>{ try{ localStorage.removeItem('chefSession'); }catch(e){} close(); };
  }
  function showChefLogin(){
    open('Шеф и су-шеф', `
      <div style="max-width:420px;margin:10px auto;">
        <p class="sub">Раздел для шефа и су-шефа. Введите код.</p>
        <input class="secfield" id="chefCodeIn" type="password" placeholder="Код" autocomplete="off">
        <button class="primary-btn" id="chefCodeBtn">Войти</button>
        <div id="chefCodeMsg" style="color:#c0453a;font-size:13px;margin-top:8px;min-height:16px;"></div>
      </div>`);
    const btn = document.getElementById('chefCodeBtn');
    btn.onclick = async ()=>{
      const code = document.getElementById('chefCodeIn').value.trim(); const msg = document.getElementById('chefCodeMsg'); msg.textContent='';
      if(!code){ msg.textContent='Введите код.'; return; }
      btn.disabled = true; btn.textContent = 'Проверяю…';
      try{ await apiPost({action:'checkChef', code}); ls.set('chefSession', {code}); showChef(); }
      catch(e){ msg.textContent = (e && e.message==='Неверный код.') ? 'Неверный код.' : 'Нет связи с сервером, попробуйте ещё раз.'; }
      finally{ btn.disabled = false; btn.textContent = 'Войти'; }
    };
  }
  function showChecklistSetup(){
    const pref = ls.get('ckPrefs', {});
    const hour = new Date().getHours();
    const type = pref.type || (hour < 15 ? 'open' : 'close');
    open('Чек-лист', `
      <div class="setup-field"><label>Чек-лист</label><div class="pillrow" id="ckType"></div></div>
      <div class="setup-field"><label>Кто заполняет</label><div class="pillrow" id="ckRole"></div></div>
      <div class="setup-field"><label>Ресторан</label><select class="secfield" id="ckRest">${RESTS.map(r=>'<option'+(r===pref.restaurant?' selected':'')+'>'+r+'</option>').join('')}</select></div>
      <div class="setup-field"><label>Имя</label><input class="secfield" id="ckName" placeholder="Ваше имя" value="${esc(pref.name||'')}"></div>
      <button class="primary-btn" id="ckStart">Начать чек-лист</button>
      <div id="ckMsg" style="color:#c0453a;font-size:13px;margin-top:8px;min-height:16px;"></div>`, showChef);
    const pills = (el, opts, cur)=>{ el.dataset.selected = cur||''; el.innerHTML = opts.map(o=>'<button class="pill'+(o[0]===cur?' active':'')+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('');
      el.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ el.dataset.selected = b.dataset.v; el.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b)); }); };
    pills(document.getElementById('ckType'), [['open','☀️ Открытие'],['close','🌙 Закрытие']], type);
    pills(document.getElementById('ckRole'), [['Шеф-повар','Шеф-повар'],['Су-шеф','Су-шеф']], pref.role||'');
    document.getElementById('ckStart').onclick = ()=>{
      const t = document.getElementById('ckType').dataset.selected, role = document.getElementById('ckRole').dataset.selected;
      const restaurant = document.getElementById('ckRest').value, name = document.getElementById('ckName').value.trim();
      const msg = document.getElementById('ckMsg');
      if(!role){ msg.textContent='Выберите: шеф-повар или су-шеф.'; return; }
      if(!name){ msg.textContent='Введите имя.'; return; }
      ls.set('ckPrefs', {type:t, role, restaurant, name});
      showChecklist({type:t, role, restaurant, name});
    };
  }
  function showChecklist(c){
    const def = SK.checklist[c.type]; const items = def.roles[c.role];
    const on = new Array(items.length).fill(false);
    open(def.title + ' · ' + c.role, `
      <div class="sub" style="margin-bottom:4px">${esc(c.restaurant)} · ${esc(c.name)}</div>
      <div style="font-size:13px;font-weight:600" id="ckCount"></div>
      <div class="ck-progress"><div id="ckBar"></div></div>
      ${items.map((t,i)=>'<div class="ck-item" data-i="'+i+'"><div class="ck-box"></div><div>'+esc(t)+'</div></div>').join('')}
      <textarea class="secfield" id="ckComment" rows="3" placeholder="Комментарий: поломки, нехватка продуктов, замечания (необязательно)" style="margin-top:6px"></textarea>
      <button class="primary-btn" id="ckSend">Готово — отправить</button>
      <div id="ckSendMsg" style="font-size:13px;margin-top:8px;min-height:16px;"></div>`, showChecklistSetup);
    const upd = ()=>{ const n = on.filter(Boolean).length; document.getElementById('ckCount').textContent = 'Выполнено ' + n + ' из ' + items.length; document.getElementById('ckBar').style.width = (100*n/items.length)+'%'; };
    body.querySelectorAll('.ck-item').forEach(el=> el.onclick = ()=>{ const i = +el.dataset.i; on[i] = !on[i]; el.classList.toggle('on', on[i]); el.querySelector('.ck-box').textContent = on[i] ? '✓' : ''; upd(); });
    upd();
    const send = document.getElementById('ckSend');
    send.onclick = async ()=>{
      const msg = document.getElementById('ckSendMsg'); msg.style.color = '#c0453a';
      const done = on.filter(Boolean).length;
      if(done < items.length && !confirm('Отмечено ' + done + ' из ' + items.length + ' пунктов. Отправить так?')) return;
      send.disabled = true; send.textContent = 'Отправляю…';
      try{
        await apiPost({action:'saveChecklist', code: chefCode(), checklist:{ type: def.title, role: c.role, restaurant: c.restaurant, name: c.name, done, total: items.length, missed: items.filter((_,i)=>!on[i]), comment: document.getElementById('ckComment').value.trim() }});
        open('Чек-лист отправлен', '<div class="doc"><div class="note">✅ ' + esc(def.title) + ' — ' + done + ' из ' + items.length + '. Запись сохранена.</div><button class="primary-btn" id="ckDone">Вернуться</button></div>', showChef);
        document.getElementById('ckDone').onclick = showChef;
      }catch(e){
        if(e && e.auth){ try{ localStorage.removeItem('chefSession'); }catch(_){} msg.textContent = 'Код шефа изменился — войдите заново.'; }
        else msg.textContent = 'Не удалось отправить: нет связи. Отметки сохранены на экране — попробуйте ещё раз.';
        send.disabled = false; send.textContent = 'Готово — отправить';
      }
    };
  }

  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-sec]'); if(!b) return;
    const k = b.dataset.sec;
    if(k==='planCook') showDoc('planCook');
    else if(k==='sanitary') showDoc('sanLearn');
    else if(k==='chef') showChef();
  });
})();
</script>

<script>
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (standalone) return;
  try{ if (Number(localStorage.getItem('ibHiddenUntil')||0) > Date.now()) return; }catch(e){}
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|CriOS|FxiOS|EdgiOS/.test(ua);
  var el = document.getElementById('installBanner'), body = document.getElementById('ibBody');
  document.getElementById('ibClose').onclick = function(){ el.style.display='none'; try{ localStorage.setItem('ibHiddenUntil', String(Date.now()+3*24*3600*1000)); }catch(e){} };
  if (isIOS) {
    body.innerHTML = inApp
      ? '<div class="ib-steps">Сейчас ссылка открыта внутри другого приложения. Нажмите <b>⋯</b> или <b>⬆</b> и выберите <b>«Открыть в Safari»</b>, там появится установка.</div>'
      : '<div class="ib-steps">Нажмите <b>«Поделиться» ⬆</b> внизу экрана → <b>«На экран Домой»</b> → <b>«Добавить»</b>.</div>';
    setTimeout(function(){ el.style.display='block'; }, 1200);
    return;
  }
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    body.innerHTML = '<button class="ib-btn" id="ibInstall">Установить</button>';
    document.getElementById('ibInstall').onclick = function(){
      deferred.prompt();
      deferred.userChoice.finally(function(){ el.style.display='none'; deferred = null; });
    };
    el.style.display='block';
  });
  window.addEventListener('appinstalled', function(){ el.style.display='none'; });
  setTimeout(function(){
    if (deferred || el.style.display==='block') return;
    if (/Android/.test(ua)) {
      body.innerHTML = '<div class="ib-steps">Откройте меню <b>⋮</b> справа вверху → <b>«Добавить на главный экран»</b> или <b>«Установить приложение»</b>.</div>';
      el.style.display='block';
    }
  }, 4000);
})();
</script>

<script>
(function(){
  var APP_LINK = 'https://saidysupov350-dev.github.io/luckee-skills/';
  var TEXT = 'Luckee Skills — тех.карты и тесты для поваров 👨‍🍳\nОткройте ссылку, введите имя, ресторан и станцию. Приложение можно добавить на экран телефона.';
  var btn = document.getElementById('shareAppBtn'); if(!btn) return;
  var msg = document.getElementById('shareMsg');
  function show(t){ msg.textContent=t; msg.style.display='block'; setTimeout(function(){ msg.style.display='none'; }, 3000); }
  btn.onclick = async function(){
    if (navigator.share) {
      try { await navigator.share({ title:'Luckee Skills', text: TEXT, url: APP_LINK }); } catch(e){}
      return;
    }
    try { await navigator.clipboard.writeText(TEXT + '\n' + APP_LINK); show('Ссылка скопирована — вставьте её в чат'); }
    catch(e){ prompt('Скопируйте ссылку:', APP_LINK); }
  };
})();
</script>
